name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: '11'

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install Buildozer dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libssl-dev libffi-dev python3-dev python3-venv
        python3 -m pip install --upgrade pip
        pip install --user buildozer cython

    - name: Install Android SDK
      run: |
        sudo apt-get install -y wget tar unzip
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        mkdir -p $HOME/android-sdk/cmdline-tools
        unzip commandlinetools-linux-9477386_latest.zip -d $HOME/android-sdk/cmdline-tools
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/tools/bin:$PATH
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0"
        sdkmanager --licenses
        sdkmanager "ndk;21.3.6528147"  # Pilih versi NDK yang tepat

    - name: Build with Buildozer
      run: |
        export ANDROIDSDK=$HOME/android-sdk
        export ANDROIDNDK=$ANDROIDSDK/ndk/21.3.6528147  # Versi NDK yang diinstall sebelumnya
        buildozer android debug
